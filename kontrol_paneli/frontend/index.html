    <script>
      // Tema, React yüklenmeden uygulanır (açılışta yanıp sönmesin).
      try {
        var t = localStorage.getItem("panel-tema");
        if (!t) t = "acik"; // varsayılan: açık tema
        document.documentElement.dataset.theme = t === "acik" ? "light" : "dark";
